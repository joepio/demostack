# Buffert request-bodies (ook chunked) zodat uWSGI altijd een Content-Length krijgt.
client_max_body_size 100m;
proxy_request_buffering on;
proxy_http_version 1.1;
proxy_read_timeout 300s;

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server { listen 8101; location / { proxy_pass http://openzaak:8000;    include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8102; location / { proxy_pass http://openklant:8000;   include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8103; location / { proxy_pass http://objects:8000;     include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8104; location / { proxy_pass http://objecttypes:8000; include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8105; location / { proxy_pass http://openforms:8000;   include /etc/nginx/conf.d/proxy_headers; } }
