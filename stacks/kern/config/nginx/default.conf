# Buffert request-bodies (ook chunked) zodat uWSGI altijd een Content-Length krijgt.
client_max_body_size 100m;
proxy_request_buffering on;
proxy_http_version 1.1;
proxy_read_timeout 300s;
# Docker-DNS opnieuw raadplegen, zodat een herstarte container (nieuw IP) direct bereikbaar is
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

server { listen 8101; location / { set $up http://openzaak:8000; proxy_pass $up;    include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8102; location / { set $up http://openklant:8000; proxy_pass $up;   include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8103; location / { set $up http://objects:8000; proxy_pass $up;     include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8104; location / { set $up http://objecttypes:8000; proxy_pass $up; include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8105; location / { set $up http://openforms:8000; proxy_pass $up;   include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8110; location / { set $up http://opennotificaties:8000; proxy_pass $up; include /etc/nginx/conf.d/proxy_headers; } }
server { listen 8113; location / { set $up http://openinwoner:8000; proxy_pass $up; include /etc/nginx/conf.d/proxy_headers; } }
