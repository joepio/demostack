sites_config_enable: true
sites_config:
  items:
    - domain: notificaties.${BASE_DOMAIN}
      name: Open Notificaties demogemeente
zgw_consumers_config_enable: true
zgw_consumers:
  services:
    - identifier: autorisaties-api
      label: Autorisaties API (Open Zaak)
      api_root: https://zaken.${BASE_DOMAIN}/autorisaties/api/v1/
      api_type: ac
      auth_type: zgw
      client_id: opennotificaties
      secret: ${ON_CLIENT_SECRET}
      user_id: opennotificaties
      user_representation: Open Notificaties
    - identifier: notificaties-api
      label: Notificaties API
      api_root: https://notificaties.${BASE_DOMAIN}/api/v1/
      api_type: nrc
      auth_type: zgw
      client_id: opennotificaties
      secret: ${ON_CLIENT_SECRET}
      user_id: opennotificaties
      user_representation: Open Notificaties
autorisaties_api_config_enable: true
autorisaties_api:
  authorizations_api_service_identifier: autorisaties-api
vng_api_common_credentials_config_enable: true
vng_api_common_credentials:
  items:
    - identifier: opennotificaties
      secret: ${ON_CLIENT_SECRET}
    - identifier: openzaak
      secret: ${OZ_TO_ON_SECRET}
    - identifier: objecten
      secret: ${OBJ_TO_ON_SECRET}
    - identifier: open-inwoner
      secret: ${OIP_ZGW_SECRET}
notifications_kanalen_config_enable: true
notifications_kanalen_config:
  items:
    - naam: autorisaties
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/autorisaties
      filters: []
    - naam: besluittypen
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/besluittypen
      filters: [catalogus]
    - naam: informatieobjecttypen
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/informatieobjecttypen
      filters: [catalogus]
    - naam: zaaktypen
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/zaaktypen
      filters: [catalogus]
    - naam: zaken
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/zaken
      filters: [bronorganisatie, zaaktype, vertrouwelijkheidaanduiding]
    - naam: documenten
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/documenten
      filters: [bronorganisatie, informatieobjecttype, vertrouwelijkheidaanduiding]
    - naam: besluiten
      documentatie_link: https://zaken.${BASE_DOMAIN}/ref/kanalen/#/besluiten
      filters: [verantwoordelijke_organisatie, besluittype]
    - naam: objecten
      documentatie_link: https://objecten.${BASE_DOMAIN}/api/v2/
      filters: [object_type]
notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: notificaties-api
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 3
  notification_delivery_retry_backoff_max: 30
