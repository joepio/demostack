sites_config_enable: true
sites_config:
  items:
    - domain: zaken.${BASE_DOMAIN}
      name: Open Zaak demogemeente
vng_api_common_credentials_config_enable: true
vng_api_common_credentials:
  items:
    - identifier: openforms
      secret: ${OZ_OPENFORMS_SECRET}
    - identifier: demo
      secret: ${OZ_DEMO_SECRET}
    - identifier: kiss
      secret: ${KISS_ZGW_SECRET}
    - identifier: opennotificaties
      secret: ${ON_CLIENT_SECRET}
    - identifier: zac
      secret: ${ZAC_ZGW_SECRET}
    - identifier: nl-portal
      secret: ${NLP_ZGW_SECRET}
    - identifier: open-inwoner
      secret: ${OIP_ZGW_SECRET}
    - identifier: mijnoverheid
      secret: ${MO_ZGW_SECRET}
    - identifier: zaakchat
      secret: ${ZAAKCHAT_ZGW_SECRET}
    - identifier: openevents
      secret: ${OE_ZGW_SECRET}
vng_api_common_applicaties_config_enable: true
vng_api_common_applicaties:
  items:
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a01
      client_ids: [openforms]
      label: Open Formulieren
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a02
      client_ids: [demo]
      label: Demo-beheer
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a03
      client_ids: [kiss]
      label: KISS
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a04
      client_ids: [opennotificaties, openzaak, objecten]
      label: Open Notificaties en notificerende componenten
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a05
      client_ids: [zac]
      label: ZAC (Dimpact)
      heeft_alle_autorisaties: true
    # Portalen: de inwoner ziet alleen eigen zaken, maar dat filter zit in het portaal, niet in Open Zaak
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a06
      client_ids: [nl-portal]
      label: NL Portal
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a07
      client_ids: [open-inwoner]
      label: Open Inwoner
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a08
      client_ids: [mijnoverheid]
      label: MijnOverheid-demo (adapter)
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a09
      client_ids: [zaakchat]
      label: ZaakChat-koppeling
      heeft_alle_autorisaties: true
    - uuid: 5f6a1c2e-3b4d-4e5f-8a9b-0c1d2e3f4a0a
      client_ids: [openevents]
      label: OpenEvents (stacks/openevents)
      heeft_alle_autorisaties: true
zgw_consumers_config_enable: true
zgw_consumers:
  services:
    - identifier: notifications-api
      label: Notificaties API
      api_root: https://notificaties.${BASE_DOMAIN}/api/v1/
      api_connection_check_path: kanaal
      api_type: nrc
      auth_type: zgw
      client_id: openzaak
      secret: ${OZ_TO_ON_SECRET}
notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: notifications-api
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 3
  notification_delivery_retry_backoff_max: 30
