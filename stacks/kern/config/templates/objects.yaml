sites_config_enable: true
sites_config:
  items:
  - domain: objecten.${BASE_DOMAIN}
    name: Objecten demogemeente
zgw_consumers_config_enable: true
zgw_consumers:
  services:
  - identifier: objecttypes-api
    label: Objecttypen API
    api_root: https://objecttypen.${BASE_DOMAIN}/api/v2/
    api_connection_check_path: objecttypes
    api_type: orc
    auth_type: api_key
    header_key: Authorization
    header_value: Token ${OT_TOKEN_OBJECTS}
  - identifier: notifications-api
    label: Notificaties API
    api_root: https://notificaties.${BASE_DOMAIN}/api/v1/
    api_connection_check_path: kanaal
    api_type: nrc
    auth_type: zgw
    client_id: objecten
    secret: ${OBJ_TO_ON_SECRET}
notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: notifications-api
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 3
  notification_delivery_retry_backoff_max: 30
tokenauth_config_enable: true
tokenauth:
  items:
    - identifier: openforms
      token: ${OBJ_TOKEN_OPENFORMS}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: Open Formulieren
      administration: Demo
      is_superuser: true
    - identifier: kiss
      token: ${OBJ_TOKEN_KISS}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: KISS
      administration: Demo
      is_superuser: true
    - identifier: zac
      token: ${OBJ_TOKEN_ZAC}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: ZAC
      administration: Demo
      is_superuser: true
    - identifier: nl-portal
      token: ${NLP_OBJ_TOKEN}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: NL Portal
      administration: Demo
      is_superuser: true
    - identifier: open-inwoner
      token: ${OIP_OBJ_TOKEN}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: Open Inwoner
      administration: Demo
      is_superuser: true
    - identifier: mijnoverheid
      token: ${MO_OBJ_TOKEN}
      contact_person: Beheer
      email: beheer@demogemeente.local
      organization: Demogemeente
      application: MijnOverheid-demo
      administration: Demo
      is_superuser: true
