# Demogemeente, stack "kern": Open Formulieren, Open Zaak, Open Klant, Objecten, Objecttypen.
# Demo-omgeving, niet voor productie. Poorten alleen op 127.0.0.1; Caddy op de host doet HTTPS.
name: kern

x-common: &common
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

x-base-env: &base-env
  DB_HOST: db
  IS_HTTPS: "yes"
  DISABLE_2FA: "yes"
  TZ: Europe/Amsterdam
  OTEL_SDK_DISABLED: "true"
  UWSGI_PROCESSES: "1"
  UWSGI_THREADS: "8"
  CELERY_WORKER_CONCURRENCY: "1"
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}
  SENDFILE_BACKEND: django_sendfile.backends.simple

x-openzaak-env: &openzaak-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: openzaak.conf.docker
  SECRET_KEY: ${OZ_SECRET_KEY}
  DB_NAME: openzaak
  DB_USER: openzaak
  DB_PASSWORD: ${OZ_DB_PASSWORD}
  SITE_DOMAIN: zaken.${BASE_DOMAIN}
  ALLOWED_HOSTS: zaken.${BASE_DOMAIN},openzaak,localhost
  CSRF_TRUSTED_ORIGINS: https://zaken.${BASE_DOMAIN}
  CORS_ALLOW_ALL_ORIGINS: "True"
  CACHE_DEFAULT: redis:6379/0
  CACHE_AXES: redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_WORKER_NAME: celery@openzaak
  OPENZAAK_SUPERUSER_USERNAME: admin
  OPENZAAK_SUPERUSER_EMAIL: admin@demogemeente.local
  DEFAULT_FROM_EMAIL: zaken@demogemeente.local

x-openklant-env: &openklant-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: openklant.conf.docker
  SECRET_KEY: ${OK_SECRET_KEY}
  DB_NAME: openklant
  DB_USER: openklant
  DB_PASSWORD: ${OK_DB_PASSWORD}
  ALLOWED_HOSTS: klant.${BASE_DOMAIN},openklant,localhost
  CSRF_TRUSTED_ORIGINS: https://klant.${BASE_DOMAIN}
  CACHE_DEFAULT: redis:6379/2
  CACHE_AXES: redis:6379/2
  CELERY_BROKER_URL: redis://redis:6379/3
  CELERY_RESULT_BACKEND: redis://redis:6379/3
  CELERY_WORKER_NAME: celery@openklant
  DEFAULT_FROM_EMAIL: klant@demogemeente.local
  NOTIFICATIONS_DISABLED: "true"

x-objects-env: &objects-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: objects.conf.docker
  SECRET_KEY: ${OBJ_SECRET_KEY}
  DB_NAME: objects
  DB_USER: objects
  DB_PASSWORD: ${OBJ_DB_PASSWORD}
  ALLOWED_HOSTS: objecten.${BASE_DOMAIN},objects,localhost
  CSRF_TRUSTED_ORIGINS: https://objecten.${BASE_DOMAIN}
  CACHE_DEFAULT: redis:6379/4
  CACHE_AXES: redis:6379/4
  CELERY_BROKER_URL: redis://redis:6379/5
  CELERY_RESULT_BACKEND: redis://redis:6379/5
  CELERY_WORKER_NAME: celery@objects
  DEFAULT_FROM_EMAIL: objecten@demogemeente.local

x-objecttypes-env: &objecttypes-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: objecttypes.conf.docker
  SECRET_KEY: ${OT_SECRET_KEY}
  DB_NAME: objecttypes
  DB_USER: objecttypes
  DB_PASSWORD: ${OT_DB_PASSWORD}
  ALLOWED_HOSTS: objecttypen.${BASE_DOMAIN},objecttypes,localhost
  CSRF_TRUSTED_ORIGINS: https://objecttypen.${BASE_DOMAIN}
  CACHE_DEFAULT: redis:6379/6
  CACHE_AXES: redis:6379/6
  DEFAULT_FROM_EMAIL: objecttypen@demogemeente.local

x-opennotificaties-env: &opennotificaties-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: nrc.conf.docker
  SECRET_KEY: ${ON_SECRET_KEY}
  DB_NAME: opennotificaties
  DB_USER: opennotificaties
  DB_PASSWORD: ${ON_DB_PASSWORD}
  ALLOWED_HOSTS: notificaties.${BASE_DOMAIN},opennotificaties,localhost
  CSRF_TRUSTED_ORIGINS: https://notificaties.${BASE_DOMAIN}
  CACHE_DEFAULT: redis:6379/9
  CACHE_AXES: redis:6379/9
  CELERY_BROKER_URL: redis://redis:6379/10
  CELERY_RESULT_BACKEND: redis://redis:6379/10
  CELERY_WORKER_NAME: celery@opennotificaties
  OPENNOTIFICATIES_SUPERUSER_USERNAME: admin
  OPENNOTIFICATIES_SUPERUSER_EMAIL: admin@demogemeente.local
  LOG_NOTIFICATIONS_IN_DB: "yes"
  DEFAULT_FROM_EMAIL: notificaties@demogemeente.local

x-openforms-env: &openforms-env
  <<: *base-env
  DJANGO_SETTINGS_MODULE: openforms.conf.docker
  SECRET_KEY: ${OF_SECRET_KEY}
  DB_NAME: openforms
  DB_USER: openforms
  DB_PASSWORD: ${OF_DB_PASSWORD}
  BASE_URL: https://formulieren.${BASE_DOMAIN}
  ALLOWED_HOSTS: formulieren.${BASE_DOMAIN},openforms,localhost
  CSRF_TRUSTED_ORIGINS: https://formulieren.${BASE_DOMAIN}
  CORS_ALLOW_ALL_ORIGINS: "true"
  CACHE_DEFAULT: redis:6379/7
  CACHE_AXES: redis:6379/7
  CACHE_PORTALOCKER: redis:6379/7
  CELERY_BROKER_URL: redis://redis:6379/8
  CELERY_RESULT_BACKEND: redis://redis:6379/8
  CELERY_WORKER_NAME: celery@openforms
  DEFAULT_FROM_EMAIL: formulieren@demogemeente.local
  SHOW_ENVIRONMENT: "yes"
  ENVIRONMENT_LABEL: Demogemeente
  ENVIRONMENT_BACKGROUND_COLOR: "#1d63ed"
  ENVIRONMENT_FOREGROUND_COLOR: white
  OPENFORMS_LOCATION_CLIENT: openforms.contrib.bag.client.BAGClient

x-kiss-env: &kiss-env
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  OIDC_AUTHORITY: https://keycloak.${BASE_DOMAIN}/realms/demogemeente
  OIDC_CLIENT_ID: kiss
  OIDC_CLIENT_SECRET: ${KISS_OIDC_SECRET}
  OIDC_MEDEWERKER_IDENTIFICATIE_CLAIM: email
  OIDC_MEDEWERKER_IDENTIFICATIE_TRUNCATE: "24"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: kiss
  POSTGRES_USER: kiss
  POSTGRES_PASSWORD: ${KISS_DB_PASSWORD}
  ORGANISATIE_IDS: "002220647"
  REGISTERS__0__IS_DEFAULT: "true"
  REGISTERS__0__REGISTRY_VERSION: OpenKlant2
  REGISTERS__0__KLANTINTERACTIE_BASE_URL: https://klant.${BASE_DOMAIN}/klantinteracties
  REGISTERS__0__KLANTINTERACTIE_TOKEN: ${OK_TOKEN_KISS}
  REGISTERS__0__ZAAKSYSTEEM_ZAKEN_BASE_URL: https://zaken.${BASE_DOMAIN}/zaken/api/v1
  REGISTERS__0__ZAAKSYSTEEM_CATALOGI_BASE_URL: https://zaken.${BASE_DOMAIN}/catalogi/api/v1
  REGISTERS__0__ZAAKSYSTEEM_DOCUMENTEN_BASE_URL: https://zaken.${BASE_DOMAIN}/documenten/api/v1
  REGISTERS__0__ZAAKSYSTEEM_API_CLIENT_ID: kiss
  REGISTERS__0__ZAAKSYSTEEM_API_KEY: ${KISS_ZGW_SECRET}
  REGISTERS__0__ZAAKSYSTEEM_DEEPLINK_URL: https://zaken.${BASE_DOMAIN}/admin/zaken/zaak/?q=
  REGISTERS__0__ZAAKSYSTEEM_DEEPLINK_PROPERTY: identificatie
  AFDELINGEN_BASE_URL: https://objecten.${BASE_DOMAIN}
  MEDEWERKER_OBJECTEN_BASE_URL: &objecten https://objecten.${BASE_DOMAIN}/api/v2
  AFDELINGEN_OBJECT_TYPE_URL: https://objecttypen.${BASE_DOMAIN}/api/v2/objecttypes/${KISS_OT_AFDELING}
  AFDELINGEN_TOKEN: &objtoken ${OBJ_TOKEN_KISS}
  GROEPEN_BASE_URL: https://objecten.${BASE_DOMAIN}
  GROEPEN_OBJECT_TYPE_URL: https://objecttypen.${BASE_DOMAIN}/api/v2/objecttypes/${KISS_OT_GROEP}
  GROEPEN_TOKEN: *objtoken
  MEDEWERKER_OBJECT_TYPE_URL: https://objecttypen.${BASE_DOMAIN}/api/v2/objecttypes/${KISS_OT_MEDEWERKER}
  MEDEWERKER_OBJECTEN_TOKEN: *objtoken
  VAC_OBJECTEN_BASE_URL: *objecten
  VAC_OBJECT_TYPE_URL: https://objecttypen.${BASE_DOMAIN}/api/v2/objecttypes/${KISS_OT_VAC}
  VAC_OBJECT_TYPE_VERSION: "1"
  VAC_OBJECTEN_TOKEN: *objtoken
  SDG_OBJECTEN_BASE_URL: *objecten
  SDG_OBJECT_TYPE_URL: https://objecttypen.${BASE_DOMAIN}/api/v2/objecttypes/${KISS_OT_KENNISARTIKEL}
  SDG_OBJECTEN_TOKEN: *objtoken
  USE_VACS: "true"
  HAAL_CENTRAAL_BASE_URL: http://personen-mock:5010/haalcentraal/api
  HAAL_CENTRAAL_API_KEY: demo
  KVK_BASE_URL: https://api.kvk.nl/test/api
  # Openbare testsleutel van de KvK, zie developers.kvk.nl
  KVK_API_KEY: l7xx1f2691f2520d487b902f4e0b57a0b197
  ELASTIC_BASE_URL: http://elasticsearch:9200
  ELASTIC_USERNAME: elastic
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_ENABLE_SSL: "false"
  FEEDBACK_EMAIL_FROM: kiss@demogemeente.local
  FEEDBACK_EMAIL_TO: beheer@demogemeente.local
  MANAGEMENTINFORMATIE_API_KEY: ${KISS_MI_KEY}

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    command: postgres -c max_connections=300
    environment:
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD}
      OZ_DB_PASSWORD: ${OZ_DB_PASSWORD}
      OK_DB_PASSWORD: ${OK_DB_PASSWORD}
      OBJ_DB_PASSWORD: ${OBJ_DB_PASSWORD}
      OT_DB_PASSWORD: ${OT_DB_PASSWORD}
      OF_DB_PASSWORD: ${OF_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KISS_DB_PASSWORD: ${KISS_DB_PASSWORD}
      GZAC_DB_PASSWORD: ${GZAC_DB_PASSWORD}
      ON_DB_PASSWORD: ${ON_DB_PASSWORD}
      ZAC_DB_PASSWORD: ${ZAC_DB_PASSWORD}
      PABC_DB_PASSWORD: ${PABC_DB_PASSWORD}
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./config/nginx:/etc/nginx/conf.d:ro
    ports:
      - 127.0.0.1:8101:8101
      - 127.0.0.1:8102:8102
      - 127.0.0.1:8103:8103
      - 127.0.0.1:8104:8104
      - 127.0.0.1:8105:8105
      - 127.0.0.1:8110:8110

  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    ports:
      - 127.0.0.1:8106:8025

  # Open Zaak
  openzaak:
    <<: *common
    image: openzaak/open-zaak:1.30.0
    environment: *openzaak-env
    volumes:
      - oz-media:/app/media
      - oz-private-media:/app/private-media
  openzaak-celery:
    <<: *common
    image: openzaak/open-zaak:1.30.0
    command: /celery_worker.sh
    environment: *openzaak-env
    volumes:
      - oz-media:/app/media
      - oz-private-media:/app/private-media
  openzaak-beat:
    <<: *common
    image: openzaak/open-zaak:1.30.0
    command: /celery_beat.sh
    environment: *openzaak-env

  # Open Klant
  openklant:
    <<: *common
    image: maykinmedia/open-klant:2.19.1
    environment: *openklant-env
    volumes:
      - ok-media:/app/media
      - ok-private-media:/app/private_media
  openklant-celery:
    <<: *common
    image: maykinmedia/open-klant:2.19.1
    command: /celery_worker.sh
    environment: *openklant-env

  # Objecten
  objects:
    <<: *common
    image: maykinmedia/objects-api:3.6.2
    environment: *objects-env
    volumes:
      - obj-media:/app/media
  objects-celery:
    <<: *common
    image: maykinmedia/objects-api:3.6.2
    command: /celery_worker.sh
    environment: *objects-env

  # Objecttypen
  objecttypes:
    <<: *common
    image: maykinmedia/objecttypes-api:3.4.2
    environment: *objecttypes-env

  # Open Notificaties
  opennotificaties:
    <<: *common
    image: openzaak/open-notificaties:1.17.0
    environment: *opennotificaties-env
  opennotificaties-celery:
    <<: *common
    image: openzaak/open-notificaties:1.17.0
    command: /celery_worker.sh
    environment: *opennotificaties-env
  opennotificaties-beat:
    <<: *common
    image: openzaak/open-notificaties:1.17.0
    command: /celery_beat.sh
    environment: *opennotificaties-env

  # Open Formulieren
  openforms:
    <<: *common
    image: openformulieren/open-forms:4.0.2
    environment: *openforms-env
    volumes: &of-volumes
      - of-media:/app/media
      - of-private-media:/app/private_media
      - of-log:/app/log
  openforms-celery:
    <<: *common
    image: openformulieren/open-forms:4.0.2
    command: /celery_worker.sh
    environment: *openforms-env
    volumes: *of-volumes
  openforms-beat:
    <<: *common
    image: openformulieren/open-forms:4.0.2
    command: /celery_beat.sh
    environment: *openforms-env

  # ---------- KCC: KISS met Keycloak, Elasticsearch en BRP-mock ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://keycloak.${BASE_DOMAIN}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    volumes:
      - ./config/generated/keycloak:/opt/keycloak/data/import:ro
    ports:
      - 127.0.0.1:8107:8080
    depends_on:
      db:
        condition: service_healthy

  elasticsearch:
    profiles: [kcc]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 5s
      retries: 20

  personen-mock:
    profiles: [kcc, zac]
    image: ghcr.io/brp-api/personen-mock:2.7.0-latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ASPNETCORE_URLS: http://+:5010

  kiss:
    profiles: [kcc]
    image: ghcr.io/klantinteractie-servicesysteem/kiss-frontend:3.2.0
    restart: unless-stopped
    environment: *kiss-env
    ports:
      - 127.0.0.1:8108:8080
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Eenmalige sync naar Elasticsearch: docker compose run --rm kiss-sync-vac (en -smoelenboek)
  kiss-sync-vac:
    image: ghcr.io/klantinteractie-servicesysteem/kiss-elastic-sync:3.2.0
    profiles: [jobs]
    command: ["vac"]
    environment: *kiss-env
  kiss-sync-smoelenboek:
    image: ghcr.io/klantinteractie-servicesysteem/kiss-elastic-sync:3.2.0
    profiles: [jobs]
    command: ["smoelenboek"]
    environment: *kiss-env

  # ---------- Zaakafhandeling: GZAC (Valtimo) met de demo-casus evenementenvergunning ----------
  gzac-backend:
    profiles: [gzac]
    image: ritense/gzac-evenementenvergunning-demo-backend:13.49.1
    restart: unless-stopped
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      SPRING_PROFILES_ACTIVE: cloud
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gzac
      SPRING_DATASOURCE_NAME: gzac
      SPRING_DATASOURCE_USERNAME: gzac
      SPRING_DATASOURCE_PASSWORD: ${GZAC_DB_PASSWORD}
      VALTIMO_DATABASE: postgres
      VALTIMO_APP_HOSTNAME: https://gzac.${BASE_DOMAIN}
      VALTIMO_API_URL: https://gzac.${BASE_DOMAIN}/api/v1/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: https://keycloak.${BASE_DOMAIN}/realms/demogemeente/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAKJWT_ISSUERURI: https://keycloak.${BASE_DOMAIN}/realms/demogemeente
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAKAPI_ISSUERURI: https://keycloak.${BASE_DOMAIN}/realms/demogemeente
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKJWT_CLIENTID: gzac-console
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENTID: gzac-m2m
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENTSECRET: ${GZAC_M2M_SECRET}
      VALTIMO_PLUGIN_ENCRYPTIONSECRET: ${GZAC_PLUGIN_SECRET}
      OPERATON_BPM_ADMINUSER_PASSWORD: ${GZAC_OPERATON_PASSWORD}
      SPRINGACTUATOR_PASSWORD: ${GZAC_ACTUATOR_PASSWORD}
      VALTIMO_WEB_CORS_CORSCONFIGURATION_ALLOWEDORIGINS: https://gzac.${BASE_DOMAIN}
      VALTIMO_WEB_CORS_CORSCONFIGURATION_ALLOWEDMETHODS: "*"
      VALTIMO_WEB_CORS_CORSCONFIGURATION_ALLOWEDHEADERS: "*"
      VALTIMO_WEB_CORS_PATHS: /**
      VALTIMO_CHANGELOG_PBAC_CLEARTABLES: "false"
      VALTIMO_OUTBOX_ENABLED: "false"
      VALTIMO_OPENSEARCH_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  # Herstelt de dossierrechten van ROLE_USER na elke herstart van GZAC
  gzac-permissions:
    image: python:3.13-alpine
    profiles: [gzac]
    restart: unless-stopped
    command: ["python", "-u", "/watch.py"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./scripts/gzac_permissions_watch.py:/watch.py:ro

  # De nginx in dit image stuurt /api door naar http://gzac-backend:8080
  gzac:
    profiles: [gzac]
    image: ritense/gzac-evenementenvergunning-demo-frontend:13.49.1
    restart: unless-stopped
    environment:
      API_URI: /api/
      KEYCLOAK_URL: https://keycloak.${BASE_DOMAIN}
      KEYCLOAK_REALM: demogemeente
      KEYCLOAK_CLIENT_ID: gzac-console
      KEYCLOAK_REDIRECT_URI: https://gzac.${BASE_DOMAIN}/keycloak/callback
      KEYCLOAK_LOGOUT_REDIRECT_URI: https://gzac.${BASE_DOMAIN}
    ports:
      - 127.0.0.1:8109:8080
    depends_on:
      - gzac-backend

  # ---------- Zaakafhandeling Dimpact: ZAC met Solr, OPA, PABC en documentconversie ----------
  solr:
    image: solr:9.11.0-slim
    profiles: [zac]
    restart: unless-stopped
    user: root  # om security.json te kopiëren; Solr zelf draait daarna als gebruiker solr
    environment:
      SOLR_JAVA_MEM: "-Xms256m -Xmx512m"
    volumes:
      - solr-data:/var/solr
    # ZAC 5.8 spreekt Solr zonder wachtwoord aan; Solr is alleen binnen het Docker-netwerk bereikbaar.
    # (Vanaf ZAC 5.9 kan basic auth: zet dan config/generated/solr/security.json terug.)
    command: bash -c "mkdir -p /var/solr/data && rm -f /var/solr/data/security.json && chown -R 8983:8983 /var/solr && runuser -u solr -- solr-precreate zac"

  opa:
    image: openpolicyagent/opa:1.21.1-static
    profiles: [zac]
    restart: unless-stopped
    command: run --server --addr=0.0.0.0:8181

  office-converter:
    image: gotenberg/gotenberg:8.37.0
    profiles: [zac]
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-routes=true", "--api-enable-basic-auth=true"]
    environment:
      GOTENBERG_API_BASIC_AUTH_USERNAME: zac
      GOTENBERG_API_BASIC_AUTH_PASSWORD: ${OFFICE_CONVERTER_PASSWORD}

  pabc-migrations:
    image: ghcr.io/platform-autorisatie-beheer-component/pabc-migrations:2.1.0
    profiles: [zac]
    environment:
      ConnectionStrings__Pabc: Host=db;Port=5432;Username=pabc;Password=${PABC_DB_PASSWORD};Database=pabc
      JSON_DATASET_PATH: /app/json/pabc-mapping-data.json
    volumes:
      - ./config/pabc-dataset.json:/app/json/pabc-mapping-data.json:ro
    depends_on:
      db:
        condition: service_healthy

  pabc-api:
    image: ghcr.io/platform-autorisatie-beheer-component/pabc-api:2.1.0
    profiles: [zac]
    restart: unless-stopped
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8000"
      API_KEY__0: ${PABC_API_KEY}
      ConnectionStrings__Pabc: Host=db;Port=5432;Username=pabc;Password=${PABC_DB_PASSWORD};Database=pabc
      Oidc__Authority: https://keycloak.${BASE_DOMAIN}/realms/demogemeente/
      Oidc__ClientId: pabc
      Oidc__ClientSecret: ${PABC_OIDC_SECRET}
      Oidc__FunctioneelBeheerderRole: administrator
      KeycloakAdmin__ClientId: pabc-admin-client
      KeycloakAdmin__ClientSecret: ${PABC_ADMIN_SECRET}
      KeycloakAdmin__ExcludedRoles__0: offline_access
      KeycloakAdmin__ExcludedRoles__1: uma_authorization
