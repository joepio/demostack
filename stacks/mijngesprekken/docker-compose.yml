# MijnGesprekken-demo op DemoStack (tijdelijk). Los van de kern-stack; alleen Caddy routeert hierheen.
# Zaken en inwoner komen alleen-lezend uit de Open Zaak van de kern-stack (via de publieke URL).
x-common: &common
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }

x-django: &django
  DB_HOST: mg-db
  IS_HTTPS: "yes"
  DISABLE_2FA: "yes"
  TZ: Europe/Amsterdam
  OTEL_SDK_DISABLED: "true"
  UWSGI_PROCESSES: "1"
  UWSGI_THREADS: "8"
  UWSGI_MAX_REQUESTS: "0"
  LOG_STDOUT: "True"
  DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD}

x-oip-env: &oip-env
  <<: *django
  DJANGO_SETTINGS_MODULE: open_inwoner.conf.docker
  SECRET_KEY: ${OIP_SECRET_KEY}
  DB_NAME: openinwoner
  DB_USER: openinwoner
  DB_PASSWORD: ${MG_DB_PASSWORD:?zie .env}
  ALLOWED_HOSTS: gesprekken-inwoner.${D},mg-oip,localhost
  CSRF_TRUSTED_ORIGINS: https://gesprekken-inwoner.${D}
  CACHE_DEFAULT: mg-redis:6379/1
  CACHE_AXES: mg-redis:6379/1
  CELERY_BROKER_URL: redis://mg-redis:6379/2
  CELERY_RESULT_BACKEND: redis://mg-redis:6379/2
  ES_HOST: http://mg-geen-es:9200
  DEFAULT_FROM_EMAIL: inwoner@demogemeente.local
  EMAIL_HOST: localhost
  DIGID_ENABLED: "True"
  DIGID_MOCK: "True"
  EHERKENNING_MOCK: "True"

services:
  mg-db:
    <<: *common
    image: postgis/postgis:17-3.5
    mem_limit: 512m
    environment: { POSTGRES_PASSWORD: "${MG_DB_PASSWORD:?zie .env}", MG_DB_PASSWORD: "${MG_DB_PASSWORD:?zie .env}" }
    command: postgres -c shared_buffers=64MB -c max_connections=100
    volumes: [ "db:/var/lib/postgresql/data", "./initdb:/docker-entrypoint-initdb.d:ro" ]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 30 }

  mg-redis:
    <<: *common
    image: redis:8
    mem_limit: 128m
    command: redis-server --save "" --maxmemory 64mb

  mg-s3:
    <<: *common
    image: motoserver/moto:5.1.4
    mem_limit: 256m
    environment: { MOTO_PORT: "5000", MOTO_S3_CUSTOM_ENDPOINTS: "https://gesprekken-s3.demostack.nl" }
    ports: [ "127.0.0.1:8143:5000" ]

  mg-app:
    <<: *common
    build: ./app
    image: mgdemo/app:1
    mem_limit: 128m
    environment:
      ISSUER: http://mg-app:8080/idp
      GRC_API: http://mg-grc:5000/api/v1
      OK_API: https://gesprekken-klant.${D}/klantinteracties/api/v1
      OK_TOKEN: ${OK_TOKEN}
      OIP_URL: https://gesprekken-inwoner.${D}/
      OK_ADMIN_URL: https://gesprekken-klant.${D}/admin/klantinteracties/klantcontact/
      ONTVANGER_ACTOR: ${ONTVANGER_ACTOR:-}
    volumes: [ "app:/data" ]
    ports: [ "127.0.0.1:8140:8080" ]

  mg-grc:
    <<: *common
    image: mgdemo/grc:b905ea6
    mem_limit: 384m
    depends_on: { mg-db: { condition: service_healthy } }
    environment:
      ASPNETCORE_ENVIRONMENT: Local
      ASPNETCORE_URLS: http://*:5000
      ConnectionStrings__UserConnectionString: Host=mg-db;Port=5432;Database=grc_db;Username=oneground_admin;Password=${MG_DB_PASSWORD:?zie .env}
      ConnectionStrings__AdminConnectionString: Host=mg-db;Port=5432;Database=grc_db;Username=oneground_admin;Password=${MG_DB_PASSWORD:?zie .env}
      Redis__ConnectionString: mg-redis
      Auth__Authority: http://mg-app:8080/idp/
      Auth__ValidIssuer: i
      Auth__ValidAudience: account
      Auth__ZgwTokenIntrospectionEndpoint: http://mg-app:8080/idp/introspect
      Services__AC__Api: http://mg-app:8080/ac/api/v1/
      Services__ZRC__Api: https://zaken.${D}/zaken/api/v1/
      Services__GRC__Api: http://mg-grc:5000/api/v1/
      ZgwServiceAccounts__Credentials__0__Rsin: "002220647"
      ZgwServiceAccounts__Credentials__0__ClientId: oneground-002220647
      ZgwServiceAccounts__Credentials__0__ClientSecret: stub
      Application__IgnoreZaakValidation: "true"
      Application__AutomatischAntwoordActor: ${AUTO_ACTOR:-}
      Application__AutomatischAntwoordNaam: Demogemeente (automatisch)
      Application__AutomatischAntwoordTekst: "Bedankt voor uw bericht. We reageren binnen 2 werkdagen."
      Application__AutomatischSluitenNaDagen: "3"
      Klantinteracties__Api: https://gesprekken-klant.${D}/klantinteracties/api/v1
      Klantinteracties__Token: ${OK_TOKEN}
      BestandOpslag__Bucket: gesprekken
      BestandOpslag__AccessKey: ${S3_KEY}
      BestandOpslag__SecretKey: ${S3_SECRET}
      BestandOpslag__ServiceUrl: https://gesprekken-s3.${D}
      ForwardedHeaders__KnownNetworks__0: 0.0.0.0/0
    ports: [ "127.0.0.1:8144:5000" ]

  mg-openklant:
    <<: *common
    image: maykinmedia/open-klant:2.19.1
    mem_limit: 512m
    depends_on: { mg-db: { condition: service_healthy } }
    environment:
      <<: *django
      DJANGO_SETTINGS_MODULE: openklant.conf.docker
      SECRET_KEY: ${OK_SECRET_KEY}
      DB_NAME: openklant
      DB_USER: openklant
      DB_PASSWORD: ${MG_DB_PASSWORD:?zie .env}
      ALLOWED_HOSTS: gesprekken-klant.${D},mg-openklant,localhost
      CSRF_TRUSTED_ORIGINS: https://gesprekken-klant.${D}
      CACHE_DEFAULT: mg-redis:6379/3
      CACHE_AXES: mg-redis:6379/3
      CELERY_BROKER_URL: redis://mg-redis:6379/4
      CELERY_RESULT_BACKEND: redis://mg-redis:6379/4
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@demogemeente.local

  mg-openklant-nginx:
    <<: *common
    image: nginx:1.29-alpine
    mem_limit: 64m
    depends_on: [ mg-openklant ]
    volumes: [ "./nginx/ok.conf:/etc/nginx/conf.d/default.conf:ro" ]
    ports: [ "127.0.0.1:8142:8000" ]

  mg-oip:
    <<: *common
    image: mgdemo/oip:5acd9d9
    mem_limit: 768m
    depends_on: { mg-db: { condition: service_healthy } }
    environment: *oip-env
    volumes: [ "oip-media:/app/media", "oip-private:/app/private_media" ]
    ports: [ "127.0.0.1:8141:8000" ]

  mg-oip-volger:
    <<: *common
    image: mgdemo/oip:5acd9d9
    mem_limit: 384m
    depends_on: [ mg-oip ]
    environment: *oip-env
    command: sh -c "sleep 60; exec python src/manage.py volg_gesprekken_events"

volumes: { db: {}, app: {}, oip-media: {}, oip-private: {} }
