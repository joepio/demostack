# Manifest van stack "dimpact" (formaat: stacks/basis/stack.yaml). Neemt de kern over
# (Open Zaak, Open Notificaties, Open Klant, Referentielijsten, Selectielijst)
# met de PodiumD-versies uit stack.env, zonder Open Product, en met losse Objecten- en
# Objecttypen-API's in plaats van Open Object 4.1.
naam: dimpact
titel: Dimpact PodiumD 4.9.3
erft: kern
zonder: [openproduct]

componenten:
  # Zelfde id als Open Object in de kern ("de objectenregistratie"), zodat de gedeelde
  # seed en rooktests ook hier draaien; de Objecttypen API is een eigen component.
  - id: openobject
    naam: Objecten API 3.6.2 (los, zoals PodiumD)
    rol: register
    services: [objecten, objecten-celery]
    health: {url: "http://objecten.local:8000/admin/", status: [200, 302]}
  - id: objecttypen
    naam: Objecttypen API 3.4.2
    rol: register
    services: [objecttypen]
    health: {url: "http://objecttypen.local:8000/admin/", status: [200, 302]}
    seed: false
  - id: brp-api
    naam: BRP-vertaler (BRP API Personen 2, officieel formaat)
    rol: infra
    services: [brp-api]
    health: {url: "http://brp-api.local:8080/health", status: [200]}
    seed: false
  - id: mailpit
    naam: Mailpit (SMTP-opvang)
    rol: infra
    services: [mailpit]
    health: {url: "http://mailpit.local:8025/livez", status: [200]}
    seed: false
  - id: openformulieren
    naam: Open Formulieren 3.5.8
    rol: portaal
    services: [openformulieren, openformulieren-celery, openformulieren-celery-beat]
    health: {url: "http://openformulieren.local:8000/admin/", status: [200, 302]}
    seed: false
  - id: clamav
    naam: ClamAV 1.5.4 (virusscan voor Open Formulieren)
    rol: infra
    services: [clamav]
    seed: false
  - id: openinwoner
    naam: Open Inwoner 2.4.3 (met Elasticsearch)
    rol: portaal
    services: [openinwoner, openinwoner-celery, elasticsearch]
    health: {url: "http://openinwoner.local:8000/", status: [200]}
    seed: false
  - id: openarchiefbeheer
    naam: Open Archiefbeheer 2.0.0
    rol: medewerker
    services: [openarchiefbeheer, openarchiefbeheer-celery, openarchiefbeheer-celery-beat]
    health: {url: "http://openarchiefbeheer.local:8000/admin/", status: [200, 302]}
    seed: false
  - id: openbeheer
    naam: Open Beheer 0.9.1
    rol: medewerker
    services: [openbeheer]
    health: {url: "http://openbeheer.local:8000/admin/", status: [200, 302]}
    seed: false
  - id: kiss
    naam: KISS 3.1.3 (Klantinteractie-Servicesysteem)
    rol: medewerker
    services: [kiss]
    health: {url: "http://kiss.local:8080/healthz", status: [200]}
    seed: false
  - id: ita
    naam: ITA 3.3.2 (Interne Taak Afhandeling, web en poller)
    rol: medewerker
    services: [ita, ita-poller]
    health: {url: "http://ita.local:8080/healthz", status: [200]}
    seed: false
  - id: pabc
    naam: PABC 1.1.1 (Platform Autorisatie Beheer Component)
    rol: integratie
    services: [pabc]
    health: {url: "http://pabc.local:8080/health", status: [200]}
    seed: false
  - id: omc
    naam: NotifyNL OMC 1.17.19 (met Notify-mock)
    rol: integratie
    services: [omc, notify-mock]
    health: {url: "http://omc.local:8080/swagger/index.html", status: [200]}
    seed: false

# Wat PodiumD 4.9.3 verder draait, maar hier niet (reden per regel; zie de README)
gepland:
  - id: zac
    naam: Zaakafhandelcomponent (ZAC) 5.4.5
    opmerking: >-
      niet draaibaar hier: image alleen op ghcr.io (geblokkeerd), bouwen uit broncode vraagt
      Gradle, JDK 21 en Node met enkele GB cache, plus Solr, OPA, Gotenberg, SmartDocuments
      en KVK/BAG; past niet in de vrije schijfruimte van deze machine
  - id: podiumd-adapter
    naam: PodiumD-adapter 0.6.7
    opmerking: "niet nodig: koppelt KISS en ITA aan de e-Suite (licentie), niet aan Open Zaak en Open Klant"
  - id: zaakbrug
    naam: ZaakBrug 2.3.32
    opmerking: "optioneel in PodiumD (StUF-ZKN naar ZGW voor oude zaaksystemen); geen StUF-afnemer in deze stack"
  - id: zgw-office-addin
    naam: ZGW Office Add-in 0.11.0
    opmerking: "niet draaibaar hier: alleen op ghcr.io en vraagt Microsoft 365 (Word/Outlook-invoegtoepassing)"
  - id: kiss-elastic-sync
    naam: KISS Elastic Sync en Elastic Open Crawler
    opmerking: >-
      niet opgenomen: vult de zoekindexen van KISS (kennisbank, website, smoelenboek) uit
      externe bronnen (SDG, website, SharePoint); crawler staat op docker.elastic.co (geblokkeerd)
  - id: frank-gateway
    naam: Frank!Gateway (APISIX) met OpenBao
    opmerking: "niet opgenomen: uitgaande gateway naar landelijke registers (BRP, KVK, BAG); hier praat alles direct met de mocks"
  - id: brp-personen-mock
    naam: BRP personen-mock 2.7.0 (officieel)
    opmerking: "niet draaibaar hier: ghcr.io geblokkeerd; vervangen door de iswish-mock met tools/brp_vertaler.py"

burgerkanalen:
  - {id: openinwoner, type: openinwoner, url: "http://openinwoner.local:8000"}
  - {id: openformulieren, type: openformulieren, url: "http://openformulieren.local:8000"}


bekende_fouten:
  rook/omc/keten-*: >-
    NotifyNL OMC 1.17.19 (de versie in PodiumD 4.9.3) weigert de notificaties van Open
    Notificaties 1.16.2 met 206 en statuscode 422: die bevatten het veld "source", dat
    het model van OMC niet kent. OMC zelf werkt (zie de rooktest met een notificatie in
    het OMC-formaat); de koppeling tussen deze twee versies niet.
