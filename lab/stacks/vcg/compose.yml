# Stack "vcg": de VCG-basisset (code.overheid.nl/CommonGround/vcg-basisset), als
# compose-opzet bovenop stacks/kern/compose.yml. De kern levert al Open Zaak, Open
# Notificaties, Open Object (Objecten en Objecttypen), Open Klant, Open Product,
# Referentielijsten en de VNG Selectielijst; deze stack voegt de rest van de basisset toe:
#
#   Laag 1-2  Open Organisatie 0.2.0      medewerkers, teams en afdelingen (API, SCIM)
#             GPP-publicatiebank 2.1.0    Woo-publicaties, documenten in Open Zaak
#             OpenPlan 0.1.0              plannen van inwoners (uit broncode gebouwd)
#             OpenPDC 3.18.1, OpenPub 3.8.7   WordPress-plugins (Yard/OpenWebconcept)
#             OpenRegister 1.0.3          Nextcloud-app (Conduction)
#   Laag 3    OpenFSC 2.4.0               twee organisaties en een directory, eigen test-CA
#   Laag 4    Operaton 2.1.5              procesengine, met een worker naar Open Zaak
#   Laag 5    Open Beheer 0.9.0           beheer van zaaktypen en objecttypen
#
# Wat niet draait (Operaton Modeler, OpenFTV) staat met reden in stacks/vcg/stack.yaml
# onder "gepland" en in stacks/vcg/README.md.
#
# Medewerkers loggen in via Keycloak-realm "vcg" (config/keycloak-vcg/); inwoners via
# de DigiD-simulatie in realm "voorbeeldstad".
#
# Afspraken: netwerkalias <component>.local, vaste tags, paden relatief aan de root van
# de repository, hostpoorten 8250-8299 (Open Beheer houdt 8155 uit stack dimpact),
# Redis-databases 22 tot en met 27.

x-django-env: &django-env
  IS_HTTPS: "no"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_PASSWORD: ${DB_APP_PASSWORD:?zie .env}
  DB_CONN_MAX_AGE: "0"
  DB_POOL_ENABLED: "False"
  DISABLE_2FA: "true"
  TWO_FACTOR_FORCE_OTP_ADMIN: "False"
  TWO_FACTOR_PATCH_ADMIN: "False"
  OTEL_SDK_DISABLED: "true"
  LOG_STDOUT: "yes"
  LOG_REQUESTS: "no"
  UWSGI_PROCESSES: ${UWSGI_PROCESSES:-2}
  UWSGI_THREADS: ${UWSGI_THREADS:-4}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  CELERY_LOGLEVEL: INFO
  DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
  GEMEENTE_NAAM: ${GEMEENTE_NAAM:-Gemeente Voorbeeldstad}
  GEMEENTE_RSIN: ${GEMEENTE_RSIN:-999990007}
  TZ: Europe/Amsterdam

x-healthcheck: &django-healthcheck
  test: ["CMD", "python", "-c", "import requests,sys; sys.exit(requests.head('http://localhost:8000/admin/', timeout=4).status_code not in (200, 302))"]
  interval: 10s
  timeout: 5s
  retries: 40
  start_period: 60s

# setup-configuration van de kern, gevolgd door de aanvulling van deze stack
# Test-PKI van OpenFSC (stacks/vcg/fsc-pki.sh), alleen-lezen
x-fsc-pki: &fsc-pki ./stacks/vcg/.fsc-pki:/pki:ro

x-init-met-aanvulling: &init-met-aanvulling
  - bash
  - -c
  - /setup_configuration.sh && OTEL_SDK_DISABLED=True python src/manage.py setup_configuration --yaml-file /app/setup_configuration_stack/data.yaml

services:
  # ------------------------------------------------- aanvullingen op de kern
  openzaak-init:
    command: *init-met-aanvulling
    environment:
      ZGW_OPENORGANISATIE_SECRET: ${ZGW_OPENORGANISATIE_SECRET:?zie .env}
      ZGW_PUBLICATIEBANK_SECRET: ${ZGW_PUBLICATIEBANK_SECRET:?zie .env}
      ZGW_OPENBEHEER_SECRET: ${ZGW_OPENBEHEER_SECRET:?zie .env}
      ZGW_OPERATON_SECRET: ${ZGW_OPERATON_SECRET:?zie .env}
    volumes:
      - ./config/openzaak/stack-vcg.yaml:/app/setup_configuration_stack/data.yaml:ro

  opennotificaties-init:
    command: *init-met-aanvulling
    environment:
      ZGW_OPENORGANISATIE_SECRET: ${ZGW_OPENORGANISATIE_SECRET:?zie .env}
    volumes:
      - ./config/opennotificaties/stack-vcg.yaml:/app/setup_configuration_stack/data.yaml:ro

  # Keycloak-realm "vcg": medewerkers van Voorbeeldstad (config/keycloak-vcg/realm.sh)
  keycloak-vcg-init:
    image: ${IMAGE_KEYCLOAK:-keycloak/keycloak:26.4.7}
    entrypoint: ["bash", "/config/realm.sh"]
    environment:
      KC_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      KC_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
      MEDEWERKER_WACHTWOORD: ${MEDEWERKER_WACHTWOORD:?zie .env}
      KEYCLOAK_OPENBEHEER_CLIENT_SECRET: ${KEYCLOAK_OPENBEHEER_CLIENT_SECRET:?zie .env}
      KEYCLOAK_OPENORGANISATIE_CLIENT_SECRET: ${KEYCLOAK_OPENORGANISATIE_CLIENT_SECRET:?zie .env}
      PORT_OPENBEHEER: ${PORT_OPENBEHEER:-8155}
      PORT_OPENORGANISATIE: ${PORT_OPENORGANISATIE:-8251}
    volumes:
      - ./config/keycloak-vcg:/config:ro
    depends_on:
      keycloak: {condition: service_healthy}

  # ======================================================== Open Organisatie
  openorganisatie-init:
    image: ${IMAGE_OPENORGANISATIE:-maykinmedia/open-organisatie:0.2.0}
    command:
      - sh
      - -c
      - >-
        python src/manage.py migrate &&
        python src/manage.py setup_configuration --yaml-file /config/data.yaml &&
        python src/manage.py shell < /tools/beheerder.py &&
        python src/manage.py shell < /config/tokens.py
    environment: &openorganisatie-env
      <<: *django-env
      DJANGO_SETTINGS_MODULE: openorganisatie.conf.docker
      SECRET_KEY: ${SECRET_KEY_OPENORGANISATIE:?zie .env}
      DB_NAME: openorganisatie
      DB_USER: openorganisatie
      ALLOWED_HOSTS: openorganisatie.local,openorganisatie,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${PORT_OPENORGANISATIE:-8251}
      SITE_DOMAIN: localhost:${PORT_OPENORGANISATIE:-8251}
      SCIM_NETLOC: openorganisatie.local:8000
      CACHE_DEFAULT: redis:6379/22
      CACHE_AXES: redis:6379/22
      CELERY_BROKER_URL: redis://redis:6379/23
      CELERY_RESULT_BACKEND: redis://redis:6379/23
      NOTIFICATIONS_DISABLED: "False"
      ZGW_OPENORGANISATIE_SECRET: ${ZGW_OPENORGANISATIE_SECRET:?zie .env}
      KEYCLOAK_OPENORGANISATIE_CLIENT_SECRET: ${KEYCLOAK_OPENORGANISATIE_CLIENT_SECRET:?zie .env}
      OPENORGANISATIE_BEHEER_TOKEN: ${OPENORGANISATIE_BEHEER_TOKEN:?zie .env}
    volumes:
      - ./config/openorganisatie:/config:ro
      - ./tools:/tools:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  openorganisatie:
    image: ${IMAGE_OPENORGANISATIE:-maykinmedia/open-organisatie:0.2.0}
    networks:
      default:
        aliases: [openorganisatie.local]
    environment: *openorganisatie-env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_OPENORGANISATIE:-8251}:8000"
    healthcheck: *django-healthcheck
    depends_on:
      openorganisatie-init: {condition: service_completed_successfully}
      keycloak-vcg-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # Verstuurt de notificaties (kanaal medewerkers) naar Open Notificaties
  openorganisatie-celery:
    image: ${IMAGE_OPENORGANISATIE:-maykinmedia/open-organisatie:0.2.0}
    command: /celery_worker.sh
    environment: *openorganisatie-env
    depends_on:
      openorganisatie: {condition: service_healthy}
    restart: unless-stopped

  # ===================================================== GPP-publicatiebank
  publicatiebank-init:
    image: ${IMAGE_PUBLICATIEBANK:-maykinmedia/woo-publications:2.1.0}
    command:
      - sh
      - -c
      - >-
        python src/manage.py migrate &&
        python src/manage.py loaddata themes &&
        python src/manage.py load_information_categories information_categories &&
        python src/manage.py load_organisations organisations &&
        python src/manage.py shell < /tools/beheerder.py &&
        python src/manage.py shell < /config/configureer.py
    environment: &publicatiebank-env
      <<: *django-env
      DJANGO_SETTINGS_MODULE: woo_publications.conf.docker
      SECRET_KEY: ${SECRET_KEY_PUBLICATIEBANK:?zie .env}
      DB_NAME: publicatiebank
      DB_USER: publicatiebank
      ALLOWED_HOSTS: publicatiebank.local,publicatiebank,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${PORT_PUBLICATIEBANK:-8252}
      SITE_DOMAIN: localhost:${PORT_PUBLICATIEBANK:-8252}
      CACHE_DEFAULT: redis:6379/24
      CACHE_AXES: redis:6379/24
      CELERY_BROKER_URL: redis://redis:6379/25
      CELERY_RESULT_BACKEND: redis://redis:6379/25
      SENDFILE_BACKEND: django_sendfile.backends.simple
      PORT_PUBLICATIEBANK: ${PORT_PUBLICATIEBANK:-8252}
      ZGW_PUBLICATIEBANK_SECRET: ${ZGW_PUBLICATIEBANK_SECRET:?zie .env}
      PUBLICATIEBANK_BEHEER_TOKEN: ${PUBLICATIEBANK_BEHEER_TOKEN:?zie .env}
      PUBLICATIEBANK_PUBLIEK_TOKEN: ${PUBLICATIEBANK_PUBLIEK_TOKEN:?zie .env}
    volumes:
      - ./config/publicatiebank:/config:ro
      - ./tools:/tools:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  publicatiebank:
    image: ${IMAGE_PUBLICATIEBANK:-maykinmedia/woo-publications:2.1.0}
    networks:
      default:
        aliases: [publicatiebank.local]
    environment: *publicatiebank-env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_PUBLICATIEBANK:-8252}:8000"
    healthcheck: *django-healthcheck
    depends_on:
      publicatiebank-init: {condition: service_completed_successfully}
      openzaak: {condition: service_healthy}
    restart: unless-stopped

  publicatiebank-celery:
    image: ${IMAGE_PUBLICATIEBANK:-maykinmedia/woo-publications:2.1.0}
    command: /celery_worker.sh
    environment: *publicatiebank-env
    depends_on:
      publicatiebank: {condition: service_healthy}
    restart: unless-stopped

  # ============================================================= Open Beheer
  openbeheer-init:
    image: ${IMAGE_OPENBEHEER:-maykinmedia/open-beheer:0.9.0}
    command: ["sh", "-c", "python src/manage.py migrate && python src/manage.py setup_configuration --yaml-file /app/setup_configuration/data-vcg.yaml && python src/manage.py shell < /tools/beheerder.py"]
    environment: &openbeheer-env
      <<: *django-env
      DJANGO_SETTINGS_MODULE: openbeheer.conf.docker
      SECRET_KEY: ${SECRET_KEY_OPENBEHEER:?zie .env}
      DB_NAME: openbeheer
      DB_USER: openbeheer
      ALLOWED_HOSTS: openbeheer.local,openbeheer,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${PORT_OPENBEHEER:-8155}
      CSRF_COOKIE_SAMESITE: Lax
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "False"
      CACHE_DEFAULT: redis:6379/26
      CACHE_AXES: redis:6379/26
      MYKN_API_URL: http://localhost:${PORT_OPENBEHEER:-8155}
      MYKN_API_PATH: /api/v1
      OPEN_ZAAK_ADMIN_BASE_URL: http://localhost:${PORT_OPENZAAK:-8001}/admin/
      ZGW_OPENBEHEER_SECRET: ${ZGW_OPENBEHEER_SECRET:?zie .env}
      OBJECTTYPEN_BEHEER_HEADER: Token ${OPENOBJECT_BEHEER_TOKEN:?zie .env}
      KEYCLOAK_OPENBEHEER_CLIENT_SECRET: ${KEYCLOAK_OPENBEHEER_CLIENT_SECRET:?zie .env}
    volumes:
      - ./config/openbeheer:/app/setup_configuration:ro
      - ./tools:/tools:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  openbeheer:
    image: ${IMAGE_OPENBEHEER:-maykinmedia/open-beheer:0.9.0}
    networks:
      default:
        aliases: [openbeheer.local]
    environment: *openbeheer-env
    healthcheck: *django-healthcheck
    depends_on:
      openbeheer-init: {condition: service_completed_successfully}
      keycloak-vcg-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # Frontend van Open Beheer (zit in het image, maar het backend serveert hem niet op /)
  openbeheer-ui:
    image: nginx:1.29.8-alpine
    volumes:
      - ./config/openbeheer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_OPENBEHEER:-8155}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      openbeheer: {condition: service_healthy}
    restart: unless-stopped

  # ================================================================ Operaton
  # Operaton Run (REST-API, Cockpit, Tasklist, Admin) met een eigen database. Het proces
  # "Parkeervergunning behandelen" staat in config/operaton/resources/ en wordt bij het
  # starten gedeployd.
  operaton:
    image: ${IMAGE_OPERATON:-operaton/operaton:2.1.5}
    networks:
      default:
        aliases: [operaton.local]
    environment: &operaton-env
      OPERATON_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      OPERATON_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?zie .env}
      WAIT_FOR: postgres:5432
      WAIT_FOR_TIMEOUT: "120"
      JAVA_OPTS: -Xms128m -Xmx512m
      TZ: Europe/Amsterdam
    volumes:
      - ./config/operaton/default.yml:/operaton/configuration/default.yml:ro
      - ./config/operaton/resources:/operaton/configuration/resources:ro
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_OPERATON:-8254}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/engine-rest/engine || curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/engine-rest/engine | grep -q 401"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # Voert de externe taken van het proces uit tegen Open Zaak (tools/operaton_worker.py)
  operaton-worker:
    image: openzaak/open-zaak:1.29.0
    entrypoint: ["python", "/tools/operaton_worker.py"]
    environment:
      <<: *operaton-env
      ZGW_OPERATON_SECRET: ${ZGW_OPERATON_SECRET:?zie .env}
      OPENORGANISATIE_BEHEER_TOKEN: ${OPENORGANISATIE_BEHEER_TOKEN:?zie .env}
    volumes:
      - ./tools:/tools:ro
    depends_on:
      operaton: {condition: service_healthy}
    restart: unless-stopped

  # ================================================================ OpenPlan
  # Plannen van inwoners (sociaal domein). Geen gepubliceerd image: stacks/vcg/bouw.sh
  # bouwt demogemeente/openplan:0.1.0 uit de broncode.
  openplan-init:
    image: demogemeente/openplan:0.1.0
    command:
      - sh
      - -c
      - >-
        python src/manage.py migrate &&
        python src/manage.py shell < /tools/beheerder.py &&
        python src/manage.py shell < /config/tokens.py
    environment: &openplan-env
      <<: *django-env
      DJANGO_SETTINGS_MODULE: openplan.conf.docker
      SECRET_KEY: ${SECRET_KEY_OPENPLAN:?zie .env}
      DB_NAME: openplan
      DB_USER: openplan
      ALLOWED_HOSTS: openplan.local,openplan,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:${PORT_OPENPLAN:-8255}
      SITE_DOMAIN: localhost:${PORT_OPENPLAN:-8255}
      CACHE_DEFAULT: redis:6379/27
      CACHE_AXES: redis:6379/27
      OPENPLAN_BEHEER_TOKEN: ${OPENPLAN_BEHEER_TOKEN:?zie .env}
    volumes:
      - ./config/openplan:/config:ro
      - ./tools:/tools:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  openplan:
    image: demogemeente/openplan:0.1.0
    networks:
      default:
        aliases: [openplan.local]
    environment: *openplan-env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_OPENPLAN:-8255}:8000"
    healthcheck: *django-healthcheck
    depends_on:
      openplan-init: {condition: service_completed_successfully}
    restart: unless-stopped

  # ========================================================= OpenPDC en OpenPub
  # WordPress-plugins van OpenWebconcept; image demogemeente/wordpress-owc (bouw.sh) met
  # WordPress 6.8.3, de plugins en wp-cli. Inrichting en inhoud: config/wordpress/.
  mariadb:
    image: ${IMAGE_MARIADB:-mariadb:11.8.3}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?zie .env}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_APP_PASSWORD:?zie .env}
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  wordpress:
    image: demogemeente/wordpress-owc:6.8.3
    networks:
      default:
        aliases: [wordpress.local]
    environment: &wordpress-env
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_APP_PASSWORD:?zie .env}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?zie .env}
      # Zelfde site onder de interne naam (seed, tests) en via localhost (browser)
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_HOST']) && $$_SERVER['HTTP_HOST'] === 'wordpress.local') {
          define('WP_HOME', 'http://wordpress.local'); define('WP_SITEURL', 'http://wordpress.local');
        }
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISABLE_WP_CRON', true);
    volumes:
      - wordpress-data:/var/www/html
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_WORDPRESS:-8256}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost/wp-includes/images/blank.gif"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mariadb: {condition: service_healthy}
    restart: unless-stopped

  wordpress-init:
    image: demogemeente/wordpress-owc:6.8.3
    entrypoint: ["bash", "/config/inrichting.sh"]
    environment:
      <<: *wordpress-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
      GEMEENTE_NAAM: ${GEMEENTE_NAAM:-Gemeente Voorbeeldstad}
      PORT_WORDPRESS: ${PORT_WORDPRESS:-8256}
    volumes:
      - wordpress-data:/var/www/html
      - ./config/wordpress:/config:ro
    depends_on:
      wordpress: {condition: service_healthy}

  # OpenRegister (Conduction) als app in Nextcloud 31: registers, schema's en objecten
  # met een eigen REST-API. Installatie zonder klikken via de omgevingsvariabelen van het
  # Nextcloud-image (database in de gedeelde Postgres); de hook in het image zet de app
  # aan na de eerste installatie.
  nextcloud:
    image: demogemeente/openregister:1.0.3
    networks:
      default:
        aliases: [openregister.local]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD:?zie .env}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USERNAME:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?zie .env}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost localhost:${PORT_NEXTCLOUD:-8257} openregister.local"
      PORT_NEXTCLOUD: ${PORT_NEXTCLOUD:-8257}
      PHP_MEMORY_LIMIT: 512M
    volumes:
      - nextcloud-data:/var/www/html
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT_NEXTCLOUD:-8257}:80"
    healthcheck:
      # Gezond als Nextcloud geinstalleerd is en OpenRegister aan staat
      test: ["CMD-SHELL", "su -s /bin/sh www-data -c 'php /var/www/html/occ app:list --enabled' | grep -q 'openregister:'"]
      interval: 15s
      timeout: 20s
      retries: 40
      start_period: 90s
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # ---------------------------------------------------------------------------------
  # OpenFSC 2.4.0 (Federatieve Service Connectiviteit): een eigen FSC-testgroep met drie
  # peers, elk met eigen componenten en database. Certificaten uit de test-PKI van
  # stacks/vcg/fsc-pki.sh (gemaakt door bouw.sh). De images hebben geen shell; daarom
  # draaien de databasemigraties als aparte *-init-containers en hebben de services
  # geen healthcheck (de tests vragen /health/ready op de monitoringpoort).
  #   directory       FSC-directory van de testgroep (manager + controller)
  #   voorbeeldstad   Gemeente Voorbeeldstad, afnemer: manager, controller, outway, txlog
  #   brp             BRP-leverancier Testland (fictief), aanbieder van de dienst
  #                   "brp-personen" (inway voor de BRP-mock): manager, controller,
  #                   inway, txlog
  # De seed publiceert de dienst, sluit het contract en tekent het namens de aanbieder.
  # ---------------------------------------------------------------------------------

  fsc-directory-init:
    image: federatedserviceconnectivity/manager:v2.4.0
    command: ["/usr/local/bin/manager", "migrate", "up", "--postgres-dsn", "postgresql://fsc_dir_manager:${DB_APP_PASSWORD:?zie .env}@postgres:5432/fsc_dir_manager?sslmode=disable&connect_timeout=5"]
    restart: on-failure:5
    depends_on:
      postgres: {condition: service_healthy}

  fsc-directory:
    image: federatedserviceconnectivity/manager:v2.4.0
    networks:
      default:
        aliases: [directory.fsc.local]
    command:
      - /usr/local/bin/manager
      - serve
      - "--listen-address-internal=0.0.0.0:7443"
      - "--listen-address-external=0.0.0.0:8443"
      - "--listen-address-internal-unauthenticated=0.0.0.0:7444"
      - "--monitoring-address=0.0.0.0:8081"
      - "--group-id=fsc-voorbeeldstad"
      - "--self-address=https://directory.fsc.local:8443"
      - "--directory-manager-address=https://directory.fsc.local:8443"
      - "--directory-peer-id=00000099000000000000"
      - "--controller-registration-api-address=https://controller.directory.fsc.local:7443"
      - "--storage-postgres-dsn=postgresql://fsc_dir_manager:${DB_APP_PASSWORD:?zie .env}@postgres:5432/fsc_dir_manager?sslmode=disable&connect_timeout=5"
      - "--auditlog-type=stdout"
      - "--tls-group-root-cert=/pki/groep/ca/root.pem"
