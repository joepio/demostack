# Open VTB (Verzoeken, Taken, Berichten): django-setup-configuration (stack maykin).
# Geheimen komen uit omgevingsvariabelen (value_from). API-tokens voor afnemers kent
# setup-configuration van Open VTB 0.2.0 nog niet; die maakt config/openvtb/tokens.py.

zgw_consumers_config_enable: true
zgw_consumers:
  services:
    - identifier: notificaties-api
      label: Open Notificaties
      api_root: http://opennotificaties.local:8000/api/v1/
      api_connection_check_path: kanaal
      api_type: nrc
      auth_type: zgw
      client_id: open-vtb
      secret:
        value_from:
          env: ZGW_OPENVTB_SECRET
      user_id: open-vtb
      user_representation: Open VTB

# Open VTB stuurt CloudEvents (taak aangemaakt, gewijzigd) naar Open Notificaties
notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: notificaties-api
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 2
  notification_delivery_retry_backoff_max: 30
