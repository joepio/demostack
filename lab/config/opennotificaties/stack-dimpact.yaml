# Open Notificaties, aanvulling voor stack "dimpact": OMC leest kanalen en abonnementen.
# Het abonnement van OMC op kanaal "zaken" maakt stacks/dimpact/seed.py aan.
vng_api_common_credentials_config_enable: true
vng_api_common_credentials:
  items:
    - identifier: omc
      secret:
        value_from:
          env: ZGW_OMC_SECRET
