# Open Notificaties: django-setup-configuration voor de demogemeente.

sites_config_enable: true
sites_config:
  items:
    - domain: opennotificaties.local:8000
      name: Open Notificaties (Gemeente Voorbeeldstad)

zgw_consumers_config_enable: true
zgw_consumers:
  services:
    # Open Notificaties vraagt de autorisaties van afnemers op bij Open Zaak
    - identifier: autorisaties-api
      label: Autorisaties API (Open Zaak)
      api_root: http://openzaak.local:8000/autorisaties/api/v1/
      api_type: ac
      auth_type: zgw
      client_id: open-notificaties
      secret:
        value_from:
          env: ZGW_OPENNOTIFICATIES_SECRET
      user_id: open-notificaties
      user_representation: Open Notificaties
    - identifier: notificaties-api
      label: Notificaties API (zichzelf)
      api_root: http://opennotificaties.local:8000/api/v1/
      api_type: nrc
      auth_type: zgw
      client_id: open-notificaties
      secret:
        value_from:
          env: ZGW_OPENNOTIFICATIES_SECRET
      user_id: open-notificaties
      user_representation: Open Notificaties

autorisaties_api_config_enable: true
autorisaties_api:
  authorizations_api_service_identifier: autorisaties-api

# Elke component die notificaties publiceert, ondertekent met dit secret
vng_api_common_credentials_config_enable: true
vng_api_common_credentials:
  items:
    - identifier: open-zaak
      secret:
        value_from:
          env: ZGW_OPENZAAK_SECRET
    - identifier: open-notificaties
      secret:
        value_from:
          env: ZGW_OPENNOTIFICATIES_SECRET
    - identifier: open-object
      secret:
        value_from:
          env: ZGW_OPENOBJECT_SECRET
    - identifier: open-klant
      secret:
        value_from:
          env: ZGW_OPENKLANT_SECRET
    - identifier: open-product
      secret:
        value_from:
          env: ZGW_OPENPRODUCT_SECRET
    - identifier: demogemeente-beheer
      secret:
        value_from:
          env: ZGW_BEHEER_SECRET

notifications_kanalen_config_enable: true
notifications_kanalen_config:
  items:
    - naam: autorisaties
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/autorisaties
      filters: []
    - naam: besluittypen
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/besluittypen
      filters: [catalogus]
    - naam: informatieobjecttypen
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/informatieobjecttypen
      filters: [catalogus]
    - naam: zaaktypen
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/zaaktypen
      filters: [catalogus]
    - naam: zaken
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/zaken
      filters: [bronorganisatie, zaaktype, vertrouwelijkheidaanduiding]
    - naam: documenten
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/documenten
      filters: [bronorganisatie, informatieobjecttype, vertrouwelijkheidaanduiding]
    - naam: besluiten
      documentatie_link: http://openzaak.local:8000/ref/kanalen/#/besluiten
      filters: [verantwoordelijke_organisatie, besluittype]
    - naam: objecten
      documentatie_link: http://openobject.local:8000/ref/kanalen/#/objecten
      filters: [object_type]
    - naam: partijen
      documentatie_link: http://openklant.local:8000/ref/kanalen/
      filters: [nummer, soort_partij]
    - naam: klantcontacten
      documentatie_link: http://openklant.local:8000/ref/kanalen/
      filters: []
    - naam: internetaken
      documentatie_link: http://openklant.local:8000/ref/kanalen/
      filters: [status]
    - naam: producten
      documentatie_link: http://openproduct.local:8000/ref/kanalen/
      filters: []

# De notificatie-sink abonneert zich op alles, zodat je in de demo (en in
# smoke.sh) kunt zien dat notificaties echt worden afgeleverd.
notifications_abonnementen_config_enable: true
notifications_abonnementen_config:
  items:
    - uuid: 5d1c0f0e-2b8e-4f7a-9c11-000000000001
      callback_url: http://notificatie-sink.local:8080/callback
      auth:
        value_from:
          env: NOTIFICATIE_SINK_AUTH
      kanalen:
        - naam: zaken
        - naam: documenten
        - naam: zaaktypen
        - naam: objecten
        - naam: partijen
        - naam: klantcontacten
        - naam: producten

notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: notificaties-api
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 2
  notification_delivery_retry_backoff_max: 30
