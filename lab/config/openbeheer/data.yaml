# Open Beheer 0.9 (stack dimpact): beheer van de zaaktypecatalogus in Open Zaak en van
# de objecttypen in de Objecttypen API.

zgw_consumers_config_enable: true
zgw_consumers:
  services:
    - identifier: catalogi-api
      label: Open Zaak - Catalogi API
      api_root: http://openzaak.local:8000/catalogi/api/v1/
      api_connection_check_path: zaaktypen
      api_type: ztc
      auth_type: zgw
      client_id: open-beheer
      secret:
        value_from:
          env: ZGW_OPENBEHEER_SECRET
    - identifier: objecttypen-api
      label: Objecttypen API
      api_root: http://objecttypen.local:8000/api/v2/
      api_connection_check_path: objecttypes
      api_type: orc
      auth_type: api_key
      header_key: Authorization
      header_value:
        value_from:
          env: OBJECTTYPEN_BEHEER_HEADER
    - identifier: selectielijst-api
      label: VNG Selectielijst (lokaal)
      api_root: http://selectielijst.local:8000/api/v1/
      api_connection_check_path: procestypen
      api_type: orc
      auth_type: no_auth

api_configuration_enabled: true
api_configuration:
  selectielijst_service_identifier: selectielijst-api
  objecttypen_service_identifier: objecttypen-api

# Medewerkers loggen in via Keycloak-realm "podiumd" (config/keycloak-podiumd/). De
# browser gaat naar localhost:8080, de server praat met keycloak.local:8080. De rollen
# van de client komen in de claim "roles"; rol "Superuser" geeft beheerrechten.
oidc_db_config_enable: true
oidc_db_config_admin_auth:
  providers:
    - identifier: keycloak-podiumd
      oidc_use_nonce: true
      oidc_nonce_size: 32
      oidc_state_size: 32
      endpoint_config:
        oidc_op_authorization_endpoint: http://localhost:8080/realms/podiumd/protocol/openid-connect/auth
        oidc_op_token_endpoint: http://keycloak.local:8080/realms/podiumd/protocol/openid-connect/token
        oidc_op_user_endpoint: http://keycloak.local:8080/realms/podiumd/protocol/openid-connect/userinfo
        oidc_op_jwks_endpoint: http://keycloak.local:8080/realms/podiumd/protocol/openid-connect/certs
        oidc_op_logout_endpoint: http://localhost:8080/realms/podiumd/protocol/openid-connect/logout
  items:
    - identifier: admin-oidc
      enabled: true
      oidc_provider_identifier: keycloak-podiumd
      oidc_rp_client_id: openbeheer
      oidc_rp_client_secret:
        value_from:
          env: KEYCLOAK_OPENBEHEER_CLIENT_SECRET
      oidc_rp_sign_algo: RS256
      oidc_rp_scopes_list:
        - openid
        - email
        - profile
      userinfo_claims_source: id_token
      options:
        user_settings:
          claim_mappings:
            username:
              - preferred_username
            first_name:
              - given_name
            last_name:
              - family_name
            email:
              - email
          username_case_sensitive: false
        groups_settings:
          claim_mapping:
            - roles
          sync: true
          sync_pattern: '*'
          default_groups: []
          make_users_staff: true
          superuser_group_names:
            - Superuser
