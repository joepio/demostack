# Open Beheer 0.9.0: het image bevat de React-frontend als statische bestanden
# (static/frontend/index.html), maar het backend serveert op / alleen een tekstpagina.
# Deze nginx zet de frontend op / (met de routes van de single-page-app) en stuurt API,
# admin, OIDC en statische bestanden door naar het backend, op dezelfde origin.
server {
    listen 8080;
    location ~ ^/(api|admin|auth|static|reset)/ {
        proxy_pass http://openbeheer.local:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://openbeheer.local:8000/static/frontend/index.html;
        proxy_set_header Host $http_host;
    }
}
