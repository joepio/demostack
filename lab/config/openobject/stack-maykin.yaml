# Open Object, aanvulling voor stack "maykin" (na config/openobject/data.yaml).
# Objecttype "Externe taak" (taken zoals Open Inwoner ze toont; schema "generieke
# dienstverlening", de UrlTaak) en tokens voor Open Formulieren en Open Inwoner.
# Het JSON-schema (objecttype-versie) voegt stacks/maykin/seed.py toe.

objecttypes_config_enable: true
objecttypes:
  items:
    - uuid: 7c1d4a0e-5a7b-4c1e-8f00-0000000000b1
      name: Externe taak

tokenauth_config_enable: true
tokenauth:
  items:
    - identifier: open-formulieren
      token:
        value_from:
          env: OPENOBJECT_OPENFORMULIEREN_TOKEN
      contact_person: Open Formulieren
      email: formulieren@voorbeeldstad.example
      organization: Gemeente Voorbeeldstad
      application: Open Formulieren
      administration: Demogemeente
      permissions:
        - object_type: 7c1d4a0e-5a7b-4c1e-8f00-0000000000a1
          mode: read_and_write
    # Open Inwoner leest alle externe taken en filtert zelf op BSN (zie de README van
    # de stack): dit token geeft dus leesrecht op de taken van alle inwoners.
    - identifier: open-inwoner
      token:
        value_from:
          env: OPENOBJECT_OPENINWONER_TOKEN
      contact_person: Open Inwoner
      email: inwonerportaal@voorbeeldstad.example
      organization: Gemeente Voorbeeldstad
      application: Open Inwoner
      administration: Demogemeente
      permissions:
        - object_type: 7c1d4a0e-5a7b-4c1e-8f00-0000000000b1
          mode: read_only
