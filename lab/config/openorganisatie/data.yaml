# Open Organisatie 0.2.0 (stack vcg): register van medewerkers, teams en afdelingen van
# Gemeente Voorbeeldstad. Publiceert wijzigingen op kanaal "medewerkers" van Open
# Notificaties; beheerders loggen in via Keycloak-realm "vcg" (config/keycloak-vcg/).
# De API-tokens maakt tokens.py (Open Organisatie heeft daar geen setup-configuration-stap voor).

zgw_consumers_config_enable: true
zgw_consumers:
  services:
    - identifier: open-notificaties
      label: Open Notificaties
      api_root: http://opennotificaties.local:8000/api/v1/
      api_connection_check_path: kanaal
      api_type: nrc
      auth_type: zgw
      client_id: open-organisatie
      user_id: open-organisatie
      secret:
        value_from:
          env: ZGW_OPENORGANISATIE_SECRET

notifications_config_enable: true
notifications_config:
  notifications_api_service_identifier: open-notificaties
  notification_delivery_max_retries: 3
  notification_delivery_retry_backoff: 2
  notification_delivery_retry_backoff_max: 10

oidc_db_config_enable: true
oidc_db_config_admin_auth:
  providers:
    - identifier: keycloak-vcg
      oidc_use_nonce: true
      oidc_nonce_size: 32
      oidc_state_size: 32
      endpoint_config:
        oidc_op_authorization_endpoint: http://localhost:8080/realms/vcg/protocol/openid-connect/auth
        oidc_op_token_endpoint: http://keycloak.local:8080/realms/vcg/protocol/openid-connect/token
        oidc_op_user_endpoint: http://keycloak.local:8080/realms/vcg/protocol/openid-connect/userinfo
        oidc_op_jwks_endpoint: http://keycloak.local:8080/realms/vcg/protocol/openid-connect/certs
        oidc_op_logout_endpoint: http://localhost:8080/realms/vcg/protocol/openid-connect/logout
  items:
    - identifier: admin-oidc
      enabled: true
      oidc_provider_identifier: keycloak-vcg
      oidc_rp_client_id: openorganisatie
      oidc_rp_client_secret:
        value_from:
          env: KEYCLOAK_OPENORGANISATIE_CLIENT_SECRET
      oidc_rp_sign_algo: RS256
      oidc_rp_scopes_list:
        - openid
        - email
        - profile
      userinfo_claims_source: id_token
      options:
        user_settings:
          claim_mappings:
            username:
              - preferred_username
            first_name:
              - given_name
            last_name:
              - family_name
            email:
              - email
          username_case_sensitive: false
        groups_settings:
          claim_mapping:
            - roles
          sync: true
          sync_pattern: '*'
          default_groups: []
          make_users_staff: true
          superuser_group_names:
            - Superuser
